[package]
name = "tempo"
version = "0.1.0"
edition = "2021"
description = "Tempo — durable cron scheduler, dead-man heartbeats, and synthetic pings for the HOLDFAST stack."
license = "MIT OR Apache-2.0"

[lib]
name = "tempo"
path = "src/lib.rs"

[[bin]]
name = "tempo"
path = "src/main.rs"

[dependencies]
# Vendored Odyssey canonical CSS (font + tokens + shared components) for server-rendered pages.
odyssey = { path = "../odyssey" }
# HTTP framework (shared with keystone/relay/loom/cellar/sanctum): State/Path/Query/Form extractors,
# server-rendered HTML for the SSO console, a plain-text public heartbeat endpoint.
axum = "0.8"
# Async runtime axum runs on. The Store trait is async: handlers `.await` it directly and PgStore
# drives sqlx natively, so a worker thread is NEVER blocked (no sync-over-async bridge). `time` backs
# the background scheduler `tokio::time::interval` tick loop; `rt-multi-thread` keeps serving parallel.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# Erase the async Store trait methods so `Arc<dyn Store>` stays object-safe (the same seam as the
# rest of the estate).
async-trait = "0.1"
# Deserialize the console form bodies; serialize the audit events + the Klaxon notify payload.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ergonomic error/store enums -> branded HTML error page.
thiserror = "2"
# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"
# Epoch -> UTC components for the run/heartbeat timestamps + the daily-schedule "HH:MM" math (std
# only — no extra C deps). Same crate the rest of the estate pins.
time = { version = "0.3", default-features = false, features = ["std"] }
# CSPRNG (OsRng) for the job ids, the heartbeat capability tokens, and the double-submit CSRF token.
# rand 0.8 matches the keystone/relay/sanctum OsRng path.
rand = "0.8"
# Outbound HTTP: firing scheduled cron pings/webhooks at `target_url` and POSTing the optional Klaxon
# notify. rustls (NO OpenSSL); default-features off so no native-tls/openssl is dragged in — the
# binary stays glibc-only, matching the estate posture.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Portable PostgreSQL data layer. Runtime queries only (sqlx::query/Row) — NO compile-time macros, so
# the build needs NO database. rustls TLS (no openssl). Standard SQL only, so the same statements
# later run unchanged on FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
