[package]
name = "delta"
version = "0.1.0"
edition = "2021"
description = "Delta — durable, offset-addressed event log / lightweight message queue for the Steadholme stack."
license = "MIT OR Apache-2.0"

[lib]
name = "delta"
path = "src/lib.rs"

[[bin]]
name = "delta"
path = "src/main.rs"

[dependencies]
# Vendored Odyssey canonical CSS (font + tokens + shared components) for server-rendered pages.
odyssey = { path = "../odyssey" }
# HTTP framework (shared with keystone/relay/inkwell): State/Path/Query/Json extractors, typed responses.
axum = "0.8"
# Async runtime axum runs on. The Store trait is async: handlers `.await` it directly and
# PgStore drives sqlx natively, so a worker thread is NEVER blocked (no sync-over-async bridge).
# `rt-multi-thread` keeps the serving runtime parallel for concurrent reads.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "io-util", "net", "time"] }
# Erase the async Store trait methods so `Arc<dyn Store>` stays object-safe (handlers depend
# only on the trait, exactly like the keystone/relay/inkwell seam).
async-trait = "0.1"
# Deserialize the JSON append/cursor bodies; serialize the JSON responses + audit events.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ergonomic error/store enums -> JSON / HTML error envelope.
thiserror = "2"
# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"
# Epoch -> UTC components for the console timestamps (std only — no C deps). Same crate the
# rest of the estate pins.
time = { version = "0.3", default-features = false, features = ["std"] }
# Portable PostgreSQL data layer. Runtime queries only (sqlx::query/Row) — NO compile-time
# macros, so the build needs NO database. rustls TLS (no openssl). Standard SQL only, so the
# same statements later run unchanged on FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
